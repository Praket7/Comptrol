name: apply-navigation-fastpath-contract-fix

on:
  push:
    branches:
      - research/computer-use-speed-reliability-20260922
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/computer-use-speed-reliability-20260922
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply navigation contract fix
        run: python3 scripts/apply_navigation_fastpath_contract_fix.py
      - name: Format and check
        run: |
          cargo fmt --all
          cargo check --workspace
      - name: Commit product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/comptrol-core/src/lib.rs
          git diff --cached --check
          git commit -m "Preserve verified navigation fast-path contract"
          git push origin HEAD:research/computer-use-speed-reliability-20260922
