name: clippy-fix

on:
  push:
    branches:
      - codex/browser-bridge-release-hardening
    paths:
      - .github/workflows/clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/browser-bridge-release-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Patch strict-clippy and bridge readiness blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('crates/comptrol-core/src/main.rs')
          text = main.read_text()
          old = 'use std::collections::HashMap;\n'
          new = 'use std::collections::{HashMap, VecDeque};\n'
          if old not in text and new not in text:
              raise SystemExit('main.rs collections import pattern not found')
          text = text.replace(old, new, 1)
          main.write_text(text)

          test = Path('crates/comptrol-core/tests/e2e_browser_bridge.rs')
          text = test.read_text()
          old = '    let child = Command::new(binary)\n'
          new = '    let mut child = Command::new(binary)\n'
          if old not in text and new not in text:
              raise SystemExit('E2E child binding pattern not found')
          text = text.replace(old, new, 1)

          old = '        if TcpStream::connect(("127.0.0.1", port)).is_ok() {\n            return Daemon { child, port };\n        }\n'
          new = '        if TcpStream::connect(("127.0.0.1", port)).is_ok()\n            && state_dir.join("browser-bridge.token").is_file()\n        {\n            return Daemon { child, port };\n        }\n'
          if old not in text and new not in text:
              raise SystemExit('E2E readiness pattern not found')
          text = text.replace(old, new, 1)

          old = '    panic!("Comptrol HTTP daemon did not become ready");\n'
          new = '    let _ = child.kill();\n    let _ = child.wait();\n    panic!("Comptrol HTTP daemon did not become ready");\n'
          if old not in text and new not in text:
              raise SystemExit('E2E timeout pattern not found')
          text = text.replace(old, new, 1)
          test.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/comptrol-core/src/main.rs crates/comptrol-core/tests/e2e_browser_bridge.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: close strict clippy and bridge E2E blockers"
          git push origin HEAD:codex/browser-bridge-release-hardening
