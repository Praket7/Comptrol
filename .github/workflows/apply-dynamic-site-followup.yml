name: apply-dynamic-site-followup

on:
  push:
    branches:
      - research/computer-use-speed-reliability-20260922
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/computer-use-speed-reliability-20260922
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply follow-up
        run: python3 scripts/apply_dynamic_site_followup.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace
      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/comptrol-core/src/browser.rs
          git diff --cached --check
          git commit -m "Harden dynamic-page state and semantic form targeting"
          git push origin HEAD:research/computer-use-speed-reliability-20260922
