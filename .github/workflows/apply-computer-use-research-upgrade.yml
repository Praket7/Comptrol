name: apply-computer-use-research-upgrade

on:
  push:
    branches:
      - research/computer-use-speed-reliability-20260922
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/computer-use-speed-reliability-20260922
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply audited upgrade
        run: python3 scripts/apply_computer_use_research_upgrade.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Compile Python adapters
        run: |
          python3 -m py_compile adapters/canva/src/adapter.py
          python3 -m py_compile adapters/powerpoint-windows/src/adapter.py
      - name: Check changed Rust crates
        run: cargo check -p comptrol-core -p comptrol-app-registry
      - name: Commit upgraded sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/comptrol-core/src/lib.rs crates/comptrol-core/src/browser.rs crates/comptrol-app-registry/src/registry.rs adapters/powerpoint-windows adapters/canva plugins/comptrol/skills/comptrol-verified-control/SKILL.md
          git diff --cached --check
          git commit -m "Improve computer-use speed, forms, and pro-app batching"
          git push origin HEAD:research/computer-use-speed-reliability-20260922
