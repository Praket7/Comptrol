name: V6 Adaptive Optimizer Apply

on:
  push:
    branches:
      - perf/v6-fastpath-20260922

permissions:
  contents: write

concurrency:
  group: comptrol-v6-optimizer-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v6-fastpath-20260922
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Make capability allowlist patch explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_v6_optimizer.py')
          text = path.read_text(encoding='utf-8')
          old = '''# Policy/default allow list and dispatch for capability.search.
          replace_once(
              core,
              '                "system.ping".to_owned(),\\n                "desktop.observe".to_owned(),',
              '                "system.ping".to_owned(),\\n                "capability.search".to_owned(),\\n                "desktop.observe".to_owned(),',
          )
          # COMPTROL_ALLOW_ALL_INTENTS has a second system.ping entry.
          text = read(core)
          needle = '                "system.ping".to_owned(),\\n                "desktop.observe".to_owned(),'
          if needle in text:
              text = text.replace(needle, '                "system.ping".to_owned(),\\n                "capability.search".to_owned(),\\n                "desktop.observe".to_owned(),', 1)
          write(core, text)
          '''
          new = '''# Policy/default allow lists and dispatch for capability.search.
          text = read(core)
          needle = '                "system.ping".to_owned(),\\n                "desktop.observe".to_owned(),'
          replacement = '                "system.ping".to_owned(),\\n                "capability.search".to_owned(),\\n                "desktop.observe".to_owned(),'
          if text.count(needle) != 2:
              raise RuntimeError(f"expected two capability policy allowlists, found {text.count(needle)}")
          write(core, text.replace(needle, replacement, 2))
          '''
          if old not in text:
              raise SystemExit('capability allowlist patch block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Align route scoring line with current implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_v6_optimizer.py')
          text = path.read_text(encoding='utf-8')
          stale = '            candidate.expected_p95_ms = stats.p95_latency_ms.or(candidate.expected_p95_ms);'
          current = '            if let Some(latency) = stats.p95_latency_ms {\n                candidate.expected_p95_ms = Some(latency);\n            }'
          if text.count(stale) != 2:
              raise SystemExit(f'expected two stale route scoring lines, found {text.count(stale)}')
          path.write_text(text.replace(stale, current), encoding='utf-8')
          PY
      - name: Apply V6 optimizer patch
        run: python3 scripts/apply_v6_optimizer.py
      - name: Format
        run: cargo fmt --all
      - name: Compile workspace
        run: cargo check --workspace
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Browser Bridge conformance
        run: python3 scripts/browser_bridge_conformance.py
      - name: Browser test suite
        run: npm run test:browser
      - name: Workspace tests
        run: cargo test --workspace
      - name: Remove temporary optimizer machinery
        run: rm scripts/apply_v6_optimizer.py .github/workflows/v6-optimizer-apply.yml
      - name: Commit V6 adaptive optimizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Implement V6 adaptive optimizer"
          git push origin HEAD:perf/v6-fastpath-20260922
