name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v0.1.33"
        required: true
        type: string

concurrency:
  group: comptrol-release
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test --workspace
      - run: python3 scripts/lint_readme.py
      - run: npm pack --workspace packages/mcp --dry-run

  native:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: comptrol-linux-intel
            binary: target/release/comptrol
          - os: macos-latest
            artifact: comptrol-macos-arm64
            binary: target/release/comptrol
          - os: macos-15-intel
            artifact: comptrol-macos-intel
            binary: target/release/comptrol
          - os: ubuntu-24.04-arm
            artifact: comptrol-linux-arm64
            binary: target/release/comptrol
          - os: windows-latest
            artifact: comptrol-windows
            binary: target/release/comptrol.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test --workspace
      - run: python scripts/package_release.py --binary "${{ matrix.binary }}" --platform "${{ matrix.artifact }}" --version "${{ env.RELEASE_TAG }}" --output release-dist
      - run: python scripts/verify_release.py --directory release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-dist

  github-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    needs: [native, source-check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Verify downloaded release assets
        run: |
          find release-assets -name '*.zip.sha256' -print0 | xargs -0 -n1 sh -c 'cd "$(dirname "$0")" && sha256sum -c "$(basename "$0")"'
      - name: Generate Homebrew formula from verified macOS archive
        run: |
          version="${RELEASE_TAG#v}"
          release_url="https://github.com/Praket7/Comptrol/releases/download/${RELEASE_TAG}"
          python3 scripts/generate_homebrew_formula.py \
            --version "$version" \
            --macos-arm64-url "$release_url/comptrol-${version}-comptrol-macos-arm64.zip" \
            --macos-arm64-sha256 "$(sha256sum "release-assets/comptrol-macos-arm64/comptrol-${version}-comptrol-macos-arm64.zip" | awk '{print $1}')" \
            --macos-intel-url "$release_url/comptrol-${version}-comptrol-macos-intel.zip" \
            --macos-intel-sha256 "$(sha256sum "release-assets/comptrol-macos-intel/comptrol-${version}-comptrol-macos-intel.zip" | awk '{print $1}')" \
            --linux-arm64-url "$release_url/comptrol-${version}-comptrol-linux-arm64.zip" \
            --linux-arm64-sha256 "$(sha256sum "release-assets/comptrol-linux-arm64/comptrol-${version}-comptrol-linux-arm64.zip" | awk '{print $1}')" \
            --linux-intel-url "$release_url/comptrol-${version}-comptrol-linux-intel.zip" \
            --linux-intel-sha256 "$(sha256sum "release-assets/comptrol-linux-intel/comptrol-${version}-comptrol-linux-intel.zip" | awk '{print $1}')" \
            --formula-name Comptrolling \
            --output release-assets/comptrolling.rb
      - name: Publish checksummed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f -print)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --generate-notes --verify-tag
          fi

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    needs: [source-check, native]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.5.1
      - run: npm --version
      - name: Show npm publication context
        run: |
          npm config get registry
          npm config get provenance
          npm view comptrolling version --json || true
      - name: Verify release and npm versions match
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./packages/mcp/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "release tag $tag_version does not match npm package version $package_version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Bundle native binaries for npm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/mcp/native
          for spec in \
            "comptrol-linux-intel linux-x64" \
            "comptrol-linux-arm64 linux-arm64" \
            "comptrol-macos-arm64 darwin-arm64" \
            "comptrol-macos-intel darwin-x64" \
            "comptrol-windows win32-x64"; do
            artifact="${spec%% *}"
            platform="${spec##* }"
            archive="$(find "release-assets/${artifact}" -name '*.zip' -type f | head -n1)"
            test -n "$archive"
            destination="packages/mcp/native/${platform}"
            staging="$(mktemp -d)"
            mkdir -p "$destination"
            unzip -q "$archive" -d "$staging"
            if test "$platform" = "win32-x64"; then
              mv "$staging/comptrol/comptrol.exe" "$destination/comptrol.exe"
            else
              mv "$staging/comptrol/comptrol" "$destination/comptrol"
            fi
          done
          chmod +x packages/mcp/native/*/comptrol 2>/dev/null || true
          test -f packages/mcp/native/darwin-arm64/comptrol
          test -f packages/mcp/native/darwin-x64/comptrol
          test -f packages/mcp/native/linux-arm64/comptrol
          test -f packages/mcp/native/linux-x64/comptrol
          test -f packages/mcp/native/win32-x64/comptrol.exe
          python3 scripts/validate_npm_package.py
      - name: Publish package with npm token
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npm publish --workspace packages/mcp --access public 2>&1 | tee "npm-publish-${attempt}.log"; then
              exit 0
            fi
            if grep -Eqi 'E403|ENEEDAUTH|forbidden|not authorized|trusted publisher' "npm-publish-${attempt}.log"; then
              echo "npm publication was rejected by registry authorization; retries will not change publisher permissions" >&2
              exit 1
            fi
            echo "transient npm publication failure on attempt ${attempt}; retrying" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Verify npm package visibility
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 20); do
            published="$(npm view "comptrolling@${version}" version --json 2>/dev/null || true)"
            if [ "$published" = "\"${version}\"" ]; then
              npm view "comptrolling@${version}" bin --json
              exit 0
            fi
            echo "npm version ${version} is still processing (attempt ${attempt}/20)"
            sleep 15
          done
          echo "npm version ${version} was published but did not become visible within the verification window" >&2
          exit 1
