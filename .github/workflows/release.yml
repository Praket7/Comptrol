name: release

on:
  push:
    tags:
      - "v*"

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test --workspace
      - run: python3 scripts/lint_readme.py
      - run: npm pack --workspace packages/mcp --dry-run

  native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: comptrol-linux
            binary: target/release/comptrol
          - os: macos-latest
            artifact: comptrol-macos
            binary: target/release/comptrol
          - os: windows-latest
            artifact: comptrol-windows
            binary: target/release/comptrol.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test --workspace
      - run: python scripts/package_release.py --binary "${{ matrix.binary }}" --platform "${{ matrix.artifact }}" --version "${{ github.ref_name }}" --output release-dist
      - run: python scripts/verify_release.py --directory release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-dist

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [native, source-check]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Verify downloaded release assets
        run: |
          find release-assets -name '*.zip.sha256' -print0 | xargs -0 -n1 sh -c 'cd "$(dirname "$0")" && sha256sum -c "$(basename "$0")"'
      - name: Generate Homebrew formula from verified macOS archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="release-assets/comptrol-macos/comptrol-${version}-comptrol-macos.zip"
          sha256="$(sha256sum "$archive" | awk '{print $1}')"
          python3 scripts/generate_homebrew_formula.py \
            --version "$version" \
            --url "https://github.com/Praket7/Comptrol/releases/download/${GITHUB_REF_NAME}/comptrol-${version}-comptrol-macos.zip" \
            --sha256 "$sha256" \
            --formula-name Comptrolling \
            --arm64-only \
            --output release-assets/comptrolling.rb
      - name: Publish checksummed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" $(find release-assets -type f -print) --generate-notes --verify-tag

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [source-check, native]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --workspace packages/mcp --access public
