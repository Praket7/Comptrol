[package]
name = "comptrol-adapter-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded out of process host for Comptrol application adapters"

[dependencies]
comptrol-adapter-sdk = { path = "../comptrol-adapter-sdk" }
getrandom = "0.3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
