manifest_version = 1
id = "comptrol.resolve"
name = "DaVinci Resolve"
version = "0.1.0"
platforms = ["windows", "macos", "linux"]
applications = ["Resolve.exe", "Resolve", "DaVinci Resolve"]

[isolation]
mode = "out_of_process"
network = "loopback_only"
filesystem = "declared_scopes"

[[capabilities]]
intent = "video.project.list"
risk = "R0"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "video.project.open"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "video.project.create"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "video.project.save"
risk = "R2"
background = "supported"
verification = "persisted_artifact"

[[capabilities]]
intent = "video.media.import"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "video.media.bin.create"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "video.media.list"
risk = "R0"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "video.timeline.list"
risk = "R0"
