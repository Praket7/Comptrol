manifest_version = 1
id = "comptrol.canva"
name = "Canva"
version = "0.1.0"
platforms = ["windows", "macos", "linux"]
applications = ["Canva", "canva"]

[isolation]
mode = "out_of_process"
network = "loopback_only"
filesystem = "declared_scopes"

[[capabilities]]
intent = "design.list"
risk = "R0"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.read"
risk = "R0"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.page.list"
risk = "R0"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.element.inspect"
risk = "R0"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.text.update"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.image.insert"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.element.create"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.element.delete"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.element.group"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.batch_edit"
risk = "R2"
background = "supported"
verification = "application_state"

[[capabilities]]
intent = "design.export"
risk = "R1"
background = "supported"
verification = "persisted_artifact"
